<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Bird</title>
  <script>
    // Reachable from explore.html (species tap) or index.html (Bird of the Day)
    (function () {
      const nav = sessionStorage.getItem('birdNav');
      if (nav !== 'fromExplore' && nav !== 'fromHome') {
        window.location.replace('index.html');
      }
      // Keep the nav value so goBack() knows where to return
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }
    .header-name {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.15;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      gap: 16px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Carousel ── */
    .carousel {
      width: 100%;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Slides strip */
    .slides {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide {
      min-width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      background: #1a0800;
      flex-shrink: 0;
      overflow: hidden;
    }
    .slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      transition: opacity 0.3s;
    }

    /* Placeholder inside a slide */
    .slide-placeholder {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
    }
    .slide-placeholder span { font-size: 3rem; }

    /* ── Arrow buttons ── */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.12s;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }
    .arrow:hover  { background: rgba(0,0,0,0.65); }
    .arrow:active { transform: translateY(-50%) scale(0.90); }
    .arrow.hidden { display: none; }
    .arrow-left  { left: 12px; }
    .arrow-right { right: 12px; }

    /* ── Dot indicators ── */
    .dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.35);
    }

    /* ── Info cards ── */
    .info-card {
      width: 100%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .info-card .card-label {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      font-weight: 600;
    }
    .info-card .common-name {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
    }
    .info-card .body-text {
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      line-height: 1.65;
      color: rgba(255,255,255,0.92);
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-name" id="headerName">Loading…</div>
  </header>

  <main>
    <!-- Photo carousel -->
    <div class="carousel" id="carousel">
      <div class="slides" id="slides"></div>
      <button class="arrow arrow-left  hidden" id="arrowLeft"  onclick="move(-1)">&#8592;</button>
      <button class="arrow arrow-right hidden" id="arrowRight" onclick="move(1)">&#8594;</button>
      <div class="dots" id="dots"></div>
    </div>

    <!-- Bird name card -->
    <div class="info-card">
      <div class="card-label">Common Name</div>
      <div class="common-name" id="commonName">—</div>
    </div>

    <!-- Description card (hidden until loaded) -->
    <div class="info-card" id="descCard" style="display:none">
      <div class="card-label">Description</div>
      <div class="body-text" id="descText"></div>
    </div>
  </main>

  <script>
    const POSSESSIVE_NAMES = new Set([
      "Aberts","Ainleys","Allens","Annas","Audubons","Bachmans","Bairds","Barrows",
      "Belchers","Bells","Bendires","Bewicks","Bicknells","Bishops","Botteris",
      "Brandts","Brants","Brewers","Bryans","Bullers","Bullocks","Bulwers","Cassins",
      "Clarks","Cooks","Coopers","Corys","Costas","Couchs","Craveris","Erckels",
      "Forsters","Franklins","Gambels","Graces","Hammonds","Harriss","Heermanns",
      "Henslows","Huttons","Jouanins","Kirtlands","Kittlitzs","LeContes","Leachs",
      "Lessons","Lewiss","Lincolns","Lucys","MacGillivrays","McCowns","McKays",
      "Morelets","Murphys","Naumanns","Nelsons","Newells","Nuttalls","Nuttings",
      "Pallass","Parkinsons","Ridgways","Rosss","Sabines","Salvins","Says","Scopolis",
      "Scotts","Scrippss","Smiths","Spragues","Stejnegers","Stellers","Swainsons",
      "Temmincks","Townsends","Tristrams","Vauxs","Virginias","Williamsons","Wilsons",
      "Worthens","Xantuss","Zinos","Rivolis"
    ]);

    function displayName(folder) {
      const specials = {
        "Chuck-wills-widow":               "Chuck-will's-widow",
        "Atlantic_Yellow-nosed_(Yellow-nosed)_Albatross": "Atlantic Yellow-nosed Albatross",
        "Desertas_(Feas)_Petrel":          "Desertas Petrel",
        "Eurasian_(Common)_Hoopoe":        "Eurasian Hoopoe",
        "Eurasian_(Common)_Moorhen":       "Eurasian Moorhen",
        "Gray-headed_(Purple)_Swamphen":   "Gray-headed Swamphen",
        "Mangrove_Yellow_(Yellow)_Warbler":"Mangrove Yellow Warbler",
        "Northern_Yellow_(Yellow)_Warbler":"Northern Yellow Warbler",
        "Pacific_(Fork-tailed)_Swift":     "Pacific Swift",
      };
      if (specials[folder]) return specials[folder];
      return folder.split('_').map(p => {
        if (POSSESSIVE_NAMES.has(p)) return p.slice(0, -1) + "'s";
        return p;
      }).join(' ');
    }

    function goBack() {
      const nav = sessionStorage.getItem('birdNav');
      sessionStorage.removeItem('birdNav');
      if (nav === 'fromHome') {
        window.location.href = 'index.html';
      } else {
        sessionStorage.setItem('flightScoreNav', 'bird');
        window.location.href = 'explore.html';
      }
    }

    // ── Cloudinary URLs ────────────────────────────────────────────────
    const params   = new URLSearchParams(window.location.search);
    const safeName = params.get('bird') || '';
    const name     = displayName(safeName);

    document.getElementById('headerName').textContent = name;
    document.getElementById('commonName').textContent = name;
    document.title = `${name} — Flight Score`;

    function smartUrl(file) {
      return `https://res.cloudinary.com/dyw8gorqu/image/upload/birds/${safeName}/${file}`;
    }

    // ── Carousel logic ─────────────────────────────────────────────────
    const slidesEl  = document.getElementById('slides');
    const dotsEl    = document.getElementById('dots');
    const arrowL    = document.getElementById('arrowLeft');
    const arrowR    = document.getElementById('arrowRight');
    let current     = 0;
    let total       = 0;           // number of slides that actually loaded

    // Files to try in order
    const files = [safeName + '.jpg', safeName + '_2.jpg', safeName + '_3.jpg'];

    // Build all 3 slide elements up front; hide ones that fail
    const slideEls = files.map((file, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide';

      // Placeholder
      const ph = document.createElement('div');
      ph.className = 'slide-placeholder';
      ph.innerHTML = '<span>🐦</span><div>Loading…</div>';
      slide.appendChild(ph);

      // Photo
      const img = document.createElement('img');
      img.alt   = name;
      img.style.opacity = '0';
      img.onload  = () => { img.style.opacity = '1'; ph.style.display = 'none'; onSlideReady(); };
      img.onerror = () => { slide.style.display = 'none'; onSlideReady(); };
      img.src     = smartUrl(file);
      slide.appendChild(img);

      slidesEl.appendChild(slide);
      return slide;
    });

    function onSlideReady() {
      // Count loaded slides each time one settles
      total = slideEls.filter(s => s.style.display !== 'none').length;
      buildDots();
      updateArrows();
    }

    function buildDots() {
      dotsEl.innerHTML = '';
      if (total <= 1) return;
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === current ? ' active' : '');
        d.onclick = () => goTo(i);
        dotsEl.appendChild(d);
      }
    }

    function updateArrows() {
      arrowL.classList.toggle('hidden', total <= 1 || current === 0);
      arrowR.classList.toggle('hidden', total <= 1 || current === total - 1);
    }

    function goTo(idx) {
      // Find the idx-th visible slide
      const visible = slideEls.filter(s => s.style.display !== 'none');
      if (idx < 0 || idx >= visible.length) return;
      // Find its position among ALL slides (including hidden) for the CSS transform
      const realIdx = slideEls.indexOf(visible[idx]);
      current = idx;
      slidesEl.style.transform = `translateX(-${realIdx * 100}%)`;
      buildDots();
      updateArrows();
    }

    function move(dir) { goTo(current + dir); }

    // Swipe support
    let touchStartX = 0;
    document.getElementById('carousel').addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('carousel').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
    }, { passive: true });

    // ── Load description from facts.json ──────────────────────────────
    fetch('facts.json')
      .then(r => r.json())
      .then(facts => {
        const entry = facts[safeName];
        if (!entry) return;
        const desc = entry['Description'] || entry['description'];
        if (!desc) return;
        document.getElementById('descText').textContent = desc;
        document.getElementById('descCard').style.display = '';
      })
      .catch(() => {}); // silently skip if unavailable
  </script>

</body>
</html>
