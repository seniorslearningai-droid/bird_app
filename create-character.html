<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(320px, 80vw, 460px);
      padding: 44px 36px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      font-size: clamp(2.2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    .character-figure {
      width: clamp(160px, 22vw, 280px);
      height: auto;
      margin-top: 20px;
    }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(160px, 40vw, 230px);
      height: 68px;
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

  <main>
    <div class="parts-col">
      <button class="part-btn" onclick="selectPart(this, 'Helmet')">Helmet</button>
      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

    <div class="figure-col">
      <svg class="character-figure" viewBox="0 0 220 480" xmlns="http://www.w3.org/2000/svg" aria-label="Character figure">
        <!-- All shapes share one black fill, so overlaps merge into a single smooth silhouette -->
        <g fill="#000">
          <!-- Head -->
          <ellipse cx="110" cy="46" rx="27" ry="33"/>
          <!-- Neck -->
          <ellipse cx="110" cy="86" rx="15" ry="15"/>
          <!-- Torso (sloped shoulders tapering to waist, slight hips) -->
          <path d="M72 128 C74 110 88 100 110 100 C132 100 146 110 148 128
                   C150 160 144 195 140 225 C138 245 140 265 142 287
                   L78 287 C80 265 82 245 80 225 C76 195 70 160 72 128 Z"/>
          <!-- Left arm (held close to the body) -->
          <path d="M72 122 C58 128 52 150 50 180 C49 210 52 250 56 286
                   C58 299 62 306 68 303 C72 300 72 293 72 286
                   C70 250 70 210 72 180 C73 158 74 140 78 124 Z"/>
          <!-- Right arm (held close to the body) -->
          <path d="M148 122 C162 128 168 150 170 180 C171 210 168 250 164 286
                   C162 299 158 306 152 303 C148 300 148 293 148 286
                   C150 250 150 210 148 180 C147 158 146 140 142 124 Z"/>
          <!-- Left leg (nearly together) -->
          <path d="M78 284 C76 322 76 372 78 416 C79 441 80 458 84 458
                   C100 458 104 448 105 420 C107 380 108 330 108 296 L78 284 Z"/>
          <!-- Right leg (nearly together) -->
          <path d="M142 284 C144 322 144 372 142 416 C141 441 140 458 136 458
                   C120 458 116 448 115 420 C113 380 112 330 112 296 L142 284 Z"/>
          <!-- Feet -->
          <ellipse cx="82" cy="460" rx="17" ry="8"/>
          <ellipse cx="138" cy="460" rx="17" ry="8"/>
        </g>
      </svg>
    </div>

    <div class="options-panel" id="optionsPanel"></div>
  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>

</body>
</html>
