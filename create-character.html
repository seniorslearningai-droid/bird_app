<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(180px, 30vw, 320px);
      padding: 46px 30px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    /* Wrapper holds the figure + the eye overlay so eyes scale with it */
    .figure-wrap {
      position: relative;
      display: inline-block;
      margin-top: 16px;
      transform: translateX(-12%) scale(var(--age-scale, 1)); /* nudge + Kid/Adult size */
      transform-origin: top center;
      transition: transform 0.2s ease;
    }
    .character-figure {
      /* explicit height scales the small source image up; capped so the
         whole figure still fits on screen */
      height: min(calc(100dvh - 150px), 72vh);
      width: auto;
      max-width: min(46vw, 360px);
      display: block;
    }
    /* Eyes overlaid on the silhouette's face; recolored by the slider */
    .eye {
      position: absolute;
      width: 6%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--eye-color, #ff0000);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 3px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .eye-left  { left: 50.5%; top: 10%; }
    .eye-right { left: 57.5%; top: 10%; }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
      max-height: calc(100dvh - 140px);   /* never run off the screen */
      overflow-y: auto;
      padding: 4px 6px 4px 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(150px, 26vw, 230px);
      height: clamp(120px, 18vh, 200px);
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .option-box .option-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Kid / Adult switch ── */
    .age-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px 20px 2px;
    }
    .age-opt {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.6);
      transition: color 0.15s;
      cursor: pointer;
      user-select: none;
    }
    .age-opt.active { color: #fff; }
    .age-switch {
      position: relative;
      width: 64px;
      height: 32px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .age-switch input { opacity: 0; width: 0; height: 0; }
    .age-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.7);
      transition: background 0.2s;
    }
    .age-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
      transition: transform 0.2s ease;
    }
    /* checked = Adult -> knob slides right */
    .age-switch input:checked ~ .age-knob { transform: translateX(32px); }

    /* ── Eye Color slider ── */
    .eye-color-bar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .eye-color-bar .ec-label {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ec-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      background: #ff0000;
    }
    .ec-value {
      font-weight: 600;
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      min-width: 64px;
      text-align: left;
    }
    /* The slider track is filled from the full color range in JS */
    .ec-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      border-radius: 10px;
      outline: none;
      border: 2px solid rgba(255,255,255,0.7);
      background: #ff0000;
    }
    .ec-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--thumb-color, #ff7a00);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .ec-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--thumb-color, #ff7a00);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

  <div class="age-bar">
    <span class="age-opt" id="ageKid" onclick="setAge(false)">Kid</span>
    <label class="age-switch">
      <input type="checkbox" id="ageToggle" checked onchange="updateAge()"/>
      <span class="age-track"></span>
      <span class="age-knob"></span>
    </label>
    <span class="age-opt" id="ageAdult" onclick="setAge(true)">Adult</span>
  </div>

  <div class="eye-color-bar">
    <div class="ec-label">
      <span class="ec-swatch" id="ecSwatch"></span>
      Eye Color
      <span class="ec-value" id="ecValue">Red</span>
    </div>
    <input class="ec-slider" id="ecSlider" type="range" min="0" step="1" value="0"
           oninput="updateEyeColor(this.value)"/>
  </div>

  <main>
    <div class="parts-col">
      <button class="part-btn" onclick="selectPart(this, 'Helmet')">Helmet</button>
      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

 L31.19,115.5 L29.77,115.05 L28.44,113.83 L27.56,112.0 L26.86,111.94 L25.97,111.56 L25.41,110.12 L25.34,109.0 L24.88,108.45 L24.62,107.75 L24.41,100.0 L24.56,76.75 L24.94,74.89 L25.06,72.5 L25.62,71.84 L26.09,70.42 L26.44,66.95 L26.56,61.75 L27.03,59.67 L27.22,57.0 L27.69,56.67 L27.92,55.61 L28.16,46.0 L29.05,44.5 L29.31,43.0 L30.44,41.8 L31.06,40.25 L32.66,39.81 L33.09,39.25 L35.03,39.2 L35.62,38.92 L35.88,38.5 L38.67,37.89 L40.12,37.23 L40.88,36.25 L43.05,35.95 L43.44,35.67 L43.56,35.25 L44.84,34.92 L45.47,34.45 L45.78,33.75 L46.44,33.31 L46.72,31.5 L46.75,27.75 L46.31,27.09 L45.94,24.75 L45.19,24.31 L44.34,23.44 L43.62,20.25 L43.36,19.94 L43.41,19.0 L43.78,18.67 L44.11,17.89 L44.25,12.5 L45.03,10.0 L46.06,9.23 L46.44,8.25 L48.03,7.7 L48.72,7.0 L49.62,6.88 L49.91,6.5 L50.61,6.48 L50.75,6.25 L51.64,6.25 Z"/>

        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
      </div>
    </div>

    <div class="options-panel" id="optionsPanel"></div>
  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // ── Kid / Adult switch ──
    function updateAge() {
      const isAdult = document.getElementById('ageToggle').checked;
      document.documentElement.style.setProperty('--age-scale', isAdult ? '1' : '0.66');
      document.getElementById('ageAdult').classList.toggle('active', isAdult);
      document.getElementById('ageKid').classList.toggle('active', !isAdult);
    }
    function setAge(isAdult) {
      document.getElementById('ageToggle').checked = isAdult;
      updateAge();
    }
    updateAge();

    // ── Eye Color slider: Red -> Black ──
    const EYE_COLORS = [
      { name: 'Crimson',    hex: '#b00020' },
      { name: 'Red',        hex: '#ff1f1f' },
      { name: 'Coral',      hex: '#ff6f61' },
      { name: 'Orange',     hex: '#ff8c00' },
      { name: 'Amber',      hex: '#ffbf00' },
      { name: 'Gold',       hex: '#ffd700' },
      { name: 'Yellow',     hex: '#fff15a' },
      { name: 'Lime',       hex: '#9be564' },
      { name: 'Green',      hex: '#2ecc40' },
      { name: 'Forest',     hex: '#1f7a3a' },
      { name: 'Teal',       hex: '#008c8c' },
      { name: 'Cyan',       hex: '#00c8ff' },
      { name: 'Sky Blue',   hex: '#4aa3ff' },
      { name: 'Blue',       hex: '#0074d9' },
      { name: 'Navy',       hex: '#173f8a' },
      { name: 'Indigo',     hex: '#4b3ca7' },
      { name: 'Purple',     hex: '#8e44ad' },
      { name: 'Magenta',    hex: '#d93bcb' },
      { name: 'Pink',       hex: '#ff8ac8' },
      { name: 'Hazel',      hex: '#9a6b2f' },
      { name: 'Brown',      hex: '#6f3f1d' },
      { name: 'Dark Brown', hex: '#2b170c' },
      { name: 'White',      hex: '#ffffff' },
      { name: 'Light Gray', hex: '#cfcfcf' },
      { name: 'Gray',       hex: '#808080' },
      { name: 'Charcoal',   hex: '#333333' },
      { name: 'Black',      hex: '#000000' },
    ];
    const ecSlider = document.getElementById('ecSlider');
    ecSlider.max = EYE_COLORS.length - 1;
    ecSlider.style.background = `linear-gradient(to right, ${
      EYE_COLORS.map((c, i) => `${c.hex} ${(i / (EYE_COLORS.length - 1)) * 100}%`).join(', ')
    })`;

    function updateEyeColor(idx) {
      const c = EYE_COLORS[idx];
      document.getElementById('ecSwatch').style.background = c.hex;
      document.getElementById('ecValue').textContent = c.name;
      ecSlider.style.setProperty('--thumb-color', c.hex);
      // Recolor the silhouette's eyes immediately
      document.querySelectorAll('.eye').forEach(e => e.style.background = c.hex);
    }
    updateEyeColor(ecSlider.value);

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        // Helmet's first option is the Red-crested Cardinal mask
        if (part === 'Helmet' && i === 0) {
          const img = document.createElement('img');
          img.className = 'option-img';
          img.src = 'North_American_Birds/Costumes/red_crested_cardinal_mask.png';
          img.alt = 'Red-crested Cardinal mask';
          box.appendChild(img);
        }
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>

</body>
</html>
