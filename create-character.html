<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(180px, 30vw, 320px);
      padding: 46px 30px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    /* Wrapper holds the figure + the eye overlay so eyes scale with it */
    .figure-wrap {
      position: relative;
      display: inline-block;
      margin-top: 16px;
      transform: translateX(-12%) scale(var(--age-scale, 1)); /* nudge + Kid/Adult size */
      transform-origin: top center;
      transition: transform 0.2s ease;
    }
    .character-figure {
      /* explicit height scales the small source image up; capped so the
         whole figure still fits on screen */
      height: min(calc(100dvh - 150px), 72vh);
      width: auto;
      max-width: min(46vw, 360px);
      display: block;
    }
    /* Figure fill follows the Skin Color slider (CSS beats the fill attr) */
    .character-figure path {
      fill: var(--skin-color, #000);
      stroke: rgba(0,0,0,0.55);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;   /* same outline thickness on both figures */
    }
    /* Soft shadow keeps the figure readable on light skin tones */
    .character-figure {
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.5)) drop-shadow(0 3px 5px rgba(0,0,0,0.28));
    }

    /* Show adult by default, kid when body.kid-mode is set */
    .kid-fig { display: none; }
    body.kid-mode .adult-fig { display: none; }
    body.kid-mode .kid-fig   { display: block; }

    /* Eyes overlaid on the face; iris recolored by the slider */
    .eye {
      position: absolute;
      width: 8%;
      aspect-ratio: 1.5 / 1;          /* almond shape */
      border-radius: 50%;
      background: #fff;                /* sclera */
      border: 1px solid rgba(50,50,50,0.85);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 2px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }
    .eye .iris {
      position: relative;
      height: 92%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--eye-color, #ff0000);
    }
    .eye .iris::before {              /* pupil */
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 50%; height: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #000;
    }
    .eye .iris::after {               /* highlight */
      content: "";
      position: absolute;
      top: 16%; left: 18%;
      width: 26%; height: 26%;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }
    .kid-eye { display: none; }
    body.kid-mode .adult-eye { display: none; }
    body.kid-mode .kid-eye   { display: flex; }   /* flex to keep the iris centered */
    /* Adult eye positions — centered on the head, mid-forehead */
    .adult-eye.eye-left  { left: 50.5%; top: 9.5%; width: 5.5%; }
    .adult-eye.eye-right { left: 57.5%; top: 9.5%; width: 5.5%; }
    /* Kid eye positions (bigger head) */
    .kid-eye.eye-left  { left: 53%; top: 11.5%; width: 6.5%; }
    .kid-eye.eye-right { left: 61%; top: 11.5%; width: 6.5%; }

    /* ── Red-crested Cardinal helmet overlay ── */
    .helmet-overlay {
      position: absolute;
      display: none;
      z-index: 4;                 /* above the eyes; holes are transparent */
      pointer-events: none;
      /* Adult placement — covers the whole head */
      width: 40%;
      left: 34%;
      top: 0%;
    }
    body.kid-mode .helmet-overlay { width: 48%; left: 32.5%; top: 0%; }
    body.helmet-on .helmet-overlay { display: block; }

    /* When the helmet is on, move the eyes into the helmet's eye holes */
    body.helmet-on .adult-eye.eye-left  { left: 46.96%; top: 10.86%; }
    body.helmet-on .adult-eye.eye-right { left: 61.12%; top: 10.86%; }
    body.helmet-on .kid-eye.eye-left    { left: 48.1%;  top: 13.1%; }
    body.helmet-on .kid-eye.eye-right   { left: 65.0%;  top: 13.1%; }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
      max-height: calc(100dvh - 140px);   /* never run off the screen */
      overflow-y: auto;
      padding: 4px 6px 4px 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(150px, 26vw, 230px);
      height: clamp(120px, 18vh, 200px);
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .option-box.selected {
      border-color: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.35);
      background: rgba(255, 255, 255, 0.22);
    }
    .option-box .option-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Kid / Adult switch ── */
    .age-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px 20px 2px;
    }
    .age-opt {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.6);
      transition: color 0.15s;
      cursor: pointer;
      user-select: none;
    }
    .age-opt.active { color: #fff; }
    .age-switch {
      position: relative;
      width: 64px;
      height: 32px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .age-switch input { opacity: 0; width: 0; height: 0; }
    .age-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.7);
      transition: background 0.2s;
    }
    .age-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
      transition: transform 0.2s ease;
    }
    /* checked = Adult -> knob slides right */
    .age-switch input:checked ~ .age-knob { transform: translateX(32px); }

    /* ── Eye Color slider ── */
    .eye-color-bar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .eye-color-bar .ec-label {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ec-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      background: #ff0000;
    }
    .ec-value {
      font-weight: 600;
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      min-width: 64px;
      text-align: left;
    }
    /* The slider track is filled from the full color range in JS */
    .ec-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      border-radius: 10px;
      outline: none;
      border: 2px solid rgba(255,255,255,0.7);
      background: #ff0000;
    }
    .ec-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--thumb-color, #ff7a00);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .ec-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--thumb-color, #ff7a00);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

  <div class="age-bar">
    <span class="age-opt" id="ageKid" onclick="setAge(false)">Kid</span>
    <label class="age-switch">
      <input type="checkbox" id="ageToggle" checked onchange="updateAge()"/>
      <span class="age-track"></span>
      <span class="age-knob"></span>
    </label>
    <span class="age-opt" id="ageAdult" onclick="setAge(true)">Adult</span>
  </div>

  <div class="eye-color-bar">
    <div class="ec-label">
      <span class="ec-swatch" id="ecSwatch"></span>
      Eye Color
      <span class="ec-value" id="ecValue">Red</span>
    </div>
    <input class="ec-slider" id="ecSlider" type="range" min="0" step="1" value="0"
           oninput="updateEyeColor(this.value)"/>
  </div>

  <div class="eye-color-bar">
    <div class="ec-label">
      <span class="ec-swatch" id="skinSwatch"></span>
      Skin Color
      <span class="ec-value" id="skinValue">Tan</span>
    </div>
    <input class="ec-slider" id="skinSlider" type="range" min="0" step="1" value="4"
           oninput="updateSkin(this.value)"/>
  </div>

  <main>
    <div class="parts-col">
      <button class="part-btn" onclick="selectPart(this, 'Helmet')">Helmet</button>
      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

    <div class="figure-col">
      <div class="figure-wrap">

    <div class="options-panel" id="optionsPanel"></div>
  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // ── Kid / Adult switch ──
    function updateAge() {
      const isAdult = document.getElementById('ageToggle').checked;
      document.body.classList.toggle('kid-mode', !isAdult);
      // Kid figure renders a bit shorter than the adult
      document.documentElement.style.setProperty('--age-scale', isAdult ? '1' : '0.82');
      document.getElementById('ageAdult').classList.toggle('active', isAdult);
      document.getElementById('ageKid').classList.toggle('active', !isAdult);
    }
    function setAge(isAdult) {
      document.getElementById('ageToggle').checked = isAdult;
      updateAge();
    }
    updateAge();

    // ── Eye Color slider: Red -> Black ──
    const EYE_COLORS = [
      { name: 'Crimson',    hex: '#b00020' },
      { name: 'Red',        hex: '#ff1f1f' },
      { name: 'Coral',      hex: '#ff6f61' },
      { name: 'Orange',     hex: '#ff8c00' },
      { name: 'Amber',      hex: '#ffbf00' },
      { name: 'Gold',       hex: '#ffd700' },
      { name: 'Yellow',     hex: '#fff15a' },
      { name: 'Lime',       hex: '#9be564' },
      { name: 'Green',      hex: '#2ecc40' },
      { name: 'Forest',     hex: '#1f7a3a' },
      { name: 'Teal',       hex: '#008c8c' },
      { name: 'Cyan',       hex: '#00c8ff' },
      { name: 'Sky Blue',   hex: '#4aa3ff' },
      { name: 'Blue',       hex: '#0074d9' },
      { name: 'Navy',       hex: '#173f8a' },
      { name: 'Indigo',     hex: '#4b3ca7' },
      { name: 'Purple',     hex: '#8e44ad' },
      { name: 'Magenta',    hex: '#d93bcb' },
      { name: 'Pink',       hex: '#ff8ac8' },
      { name: 'Hazel',      hex: '#9a6b2f' },
      { name: 'Brown',      hex: '#6f3f1d' },
      { name: 'Dark Brown', hex: '#2b170c' },
      { name: 'White',      hex: '#ffffff' },
      { name: 'Light Gray', hex: '#cfcfcf' },
      { name: 'Gray',       hex: '#808080' },
      { name: 'Charcoal',   hex: '#333333' },
      { name: 'Black',      hex: '#000000' },
    ];
    const ecSlider = document.getElementById('ecSlider');
    ecSlider.max = EYE_COLORS.length - 1;
    ecSlider.style.background = `linear-gradient(to right, ${
      EYE_COLORS.map((c, i) => `${c.hex} ${(i / (EYE_COLORS.length - 1)) * 100}%`).join(', ')
    })`;

    function updateEyeColor(idx) {
      const c = EYE_COLORS[idx];
      document.getElementById('ecSwatch').style.background = c.hex;
      document.getElementById('ecValue').textContent = c.name;
      ecSlider.style.setProperty('--thumb-color', c.hex);
      // Recolor the silhouette's irises immediately
      document.querySelectorAll('.eye .iris').forEach(i => i.style.background = c.hex);
    }
    updateEyeColor(ecSlider.value);

    // ── Skin Color slider: light -> dark ──
    const SKIN_TONES = [
      { name: 'Porcelain',  hex: '#ffe0c4' },
      { name: 'Fair',       hex: '#f6cfa8' },
      { name: 'Light',      hex: '#efbf91' },
      { name: 'Beige',      hex: '#e3aa73' },
      { name: 'Tan',        hex: '#d49a63' },
      { name: 'Olive',      hex: '#bb8048' },
      { name: 'Brown',      hex: '#99623b' },
      { name: 'Deep',       hex: '#7a4a2b' },
      { name: 'Dark',       hex: '#5a3621' },
      { name: 'Ebony',      hex: '#3d2417' },
    ];
    const skinSlider = document.getElementById('skinSlider');
    skinSlider.max = SKIN_TONES.length - 1;
    skinSlider.style.background = `linear-gradient(to right, ${
      SKIN_TONES.map((c, i) => `${c.hex} ${(i / (SKIN_TONES.length - 1)) * 100}%`).join(', ')
    })`;

    function updateSkin(idx) {
      const c = SKIN_TONES[idx];
      document.getElementById('skinSwatch').style.background = c.hex;
      document.getElementById('skinValue').textContent = c.name;
      skinSlider.style.setProperty('--thumb-color', c.hex);
      // Tint the silhouette (both adult and kid)
      document.documentElement.style.setProperty('--skin-color', c.hex);
    }
    updateSkin(skinSlider.value);

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        // Helmet's first option is the Red-crested Cardinal helmet (front view)
        if (part === 'Helmet' && i === 0) {
          const img = document.createElement('img');
          img.className = 'option-img';
          img.src = 'North_American_Birds/Costumes/red_crested_cardinal_helmet_front.png';
          img.alt = 'Red-crested Cardinal helmet';
          box.appendChild(img);
          box.style.cursor = 'pointer';
          if (document.body.classList.contains('helmet-on')) box.classList.add('selected');
          box.onclick = () => {
            const on = document.body.classList.toggle('helmet-on');
            box.classList.toggle('selected', on);
          };
        }
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>
