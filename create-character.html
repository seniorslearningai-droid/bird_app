<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(150px, 28vw, 230px);
      padding: 28px 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    .character-figure {
      /* explicit height scales the small source image up; capped so the
         whole figure still fits on screen */
      height: min(calc(100dvh - 150px), 72vh);
      width: auto;
      max-width: min(46vw, 360px);
      margin-top: 16px;
      transform: translateX(-12%);         /* nudge toward true center */
    }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(110px, 22vw, 150px);
      height: 56px;
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
    }

    /* ── Eye Color slider ── */
    .eye-color-bar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .eye-color-bar .ec-label {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ec-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      background: #ff0000;
    }
    .ec-value {
      font-weight: 600;
      font-size: clamp(0.9rem, 2.6vw, 1.1rem);
      min-width: 64px;
      text-align: left;
    }
    /* The slider track shows the full colour range */
    .ec-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      border-radius: 10px;
      outline: none;
      border: 2px solid rgba(255,255,255,0.7);
      background: linear-gradient(to right,
        #ff0000 0%, #ff7f00 11.1%, #ffd400 22.2%, #2ecc40 33.3%,
        #0074d9 44.4%, #8e44ad 55.5%, #8b4513 66.6%, #ffffff 77.7%,
        #808080 88.8%, #000000 100%);
    }
    .ec-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #ff7a00;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .ec-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #ff7a00;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

  <div class="eye-color-bar">
    <div class="ec-label">
      <span class="ec-swatch" id="ecSwatch"></span>
      Eye Color
      <span class="ec-value" id="ecValue">Red</span>
    </div>
    <input class="ec-slider" id="ecSlider" type="range" min="0" max="9" step="1" value="0"
           oninput="updateEyeColor(this.value)"/>
  </div>

  <main>
    <div class="parts-col">
      <button class="part-btn" onclick="selectPart(this, 'Helmet')">Helmet</button>
      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

    <div class="figure-col">
      <img class="character-figure" src="character.png" alt="Character figure"/>
    </div>

    <div class="options-panel" id="optionsPanel"></div>
  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // ── Eye Color slider: Red -> Black ──
    const EYE_COLORS = [
      { name: 'Red',    hex: '#ff0000' },
      { name: 'Orange', hex: '#ff7f00' },
      { name: 'Yellow', hex: '#ffd400' },
      { name: 'Green',  hex: '#2ecc40' },
      { name: 'Blue',   hex: '#0074d9' },
      { name: 'Purple', hex: '#8e44ad' },
      { name: 'Brown',  hex: '#8b4513' },
      { name: 'White',  hex: '#ffffff' },
      { name: 'Gray',   hex: '#808080' },
      { name: 'Black',  hex: '#000000' },
    ];
    function updateEyeColor(idx) {
      const c = EYE_COLORS[idx];
      document.getElementById('ecSwatch').style.background = c.hex;
      document.getElementById('ecValue').textContent = c.name;
    }
    updateEyeColor(document.getElementById('ecSlider').value);

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>

</body>
</html>
