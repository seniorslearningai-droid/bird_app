<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(150px, 28vw, 230px);
      padding: 28px 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    .character-figure {
      width: clamp(150px, 26vw, 300px);
      max-width: 100%;
      height: auto;
      margin-top: 20px;
    }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(110px, 22vw, 150px);
      height: 56px;
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>
