<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Create Your Character</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 40px 8px 40px 6px;
      gap: 22px;
      width: 100%;
    }

    /* Left column — part buttons */
    .parts-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
      flex-shrink: 0;
    }

    .part-btn {
      width: clamp(320px, 80vw, 460px);
      padding: 44px 36px;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      font-size: clamp(2.2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .part-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }
    .part-btn:active { transform: scale(0.96); }
    .part-btn.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: #fff;
    }

    /* Center — character figure */
    .figure-col {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      align-self: stretch;
    }
    .character-figure {
      width: clamp(160px, 22vw, 280px);
      height: auto;
      margin-top: 20px;
    }

    /* Right column — options panel with empty boxes */
    .options-panel {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      flex-shrink: 0;
    }
    .options-panel.open { display: flex; }

    /* Each box is about half the size of a Helmet button */
    .option-box {
      width: clamp(160px, 40vw, 230px);
      height: 68px;
      background: rgba(255, 255, 255, 0.10);
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <div class="header-title">Create Your Character</div>
  </header>

  <main>
    <div class="parts-col">
      <button class="part-btn" onclick="selectPart(this, 'Helmet')">Helmet</button>
      <button class="part-btn" onclick="selectPart(this, 'Shirt')">Shirt</button>
      <button class="part-btn" onclick="selectPart(this, 'Pants')">Pants</button>
    </div>

    <div class="figure-col">
      <svg class="character-figure" viewBox="0 0 220 480" xmlns="http://www.w3.org/2000/svg" aria-label="Character figure">
        <!-- All shapes share one black fill, so overlaps merge into a single smooth silhouette -->
        <g fill="#000">
          <!-- Head -->
          <ellipse cx="110" cy="54" rx="33" ry="38"/>
          <!-- Neck -->
          <ellipse cx="110" cy="98" rx="14" ry="16"/>
          <!-- Torso (broad shoulders tapering to waist and hips) -->
          <path d="M60 140 C60 116 84 104 110 104 C136 104 160 116 160 140
                   C158 180 150 215 146 250 C148 268 150 285 150 302
                   L70 302 C70 285 72 268 74 250 C70 215 62 180 60 140 Z"/>
          <!-- Left arm -->
          <path d="M62 130 C46 134 40 158 38 188 C37 220 40 258 45 292
                   C47 301 57 301 58 292 C62 258 64 220 64 190
                   C66 162 70 142 74 130 Z"/>
          <!-- Right arm -->
          <path d="M158 130 C174 134 180 158 182 188 C183 220 180 258 175 292
                   C173 301 163 301 162 292 C158 258 156 220 156 190
                   C154 162 150 142 146 130 Z"/>
          <!-- Left leg -->
          <path d="M70 300 C68 340 70 390 72 436 C72 452 74 462 82 462
                   C96 462 98 452 98 436 C100 390 102 345 104 304 L70 300 Z"/>
          <!-- Right leg -->
          <path d="M150 300 C152 340 150 390 148 436 C148 452 146 462 138 462
                   C124 462 122 452 122 436 C120 390 118 345 116 304 L150 300 Z"/>
          <!-- Feet -->
          <ellipse cx="80" cy="462" rx="18" ry="9"/>
          <ellipse cx="140" cy="462" rx="18" ry="9"/>
        </g>
      </svg>
    </div>

    <div class="options-panel" id="optionsPanel"></div>
  </main>

  <script>
    function goBack() {
      window.location.href = 'profile.html';
    }

    // Each part has its own independent set of option boxes.
    const PART_OPTIONS = {
      Helmet: 6,
      Shirt:  6,
      Pants:  6,
    };

    function selectPart(btn, part) {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const panel = document.getElementById('optionsPanel');
      panel.innerHTML = '';
      const count = PART_OPTIONS[part] || 0;
      for (let i = 0; i < count; i++) {
        const box = document.createElement('div');
        box.className = 'option-box';
        panel.appendChild(box);
      }
      panel.classList.add('open');
    }
  </script>

</body>
</html>
