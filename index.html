<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #e8f5e0;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 22px 24px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-svg {
      width: clamp(56px, 11vw, 80px);
      height: clamp(56px, 11vw, 80px);
      flex-shrink: 0;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }
    .header-text { display: flex; flex-direction: column; }
    header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 28px rgba(0, 0, 0, 0.3);
      line-height: 1;
    }
    header p {
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      color: rgba(255,255,255,0.8);
      margin-top: 5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      width: 90%;
      max-width: 480px;
      margin: 16px auto 0;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    /* corner brackets */
    .c-tr, .c-bl, .c-tl, .c-br {
      content: "";
      position: absolute;
      width: 26px; height: 26px;
      border-color: rgba(255, 255, 255, 0.7);
      border-style: solid;
      z-index: 3;
    }
    .c-tl { top: 14px;    left: 14px;   border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .c-br { bottom: 14px; right: 14px;  border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
    .c-tr { top: 14px;    right: 14px;  border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .c-bl { bottom: 14px; left: 14px;   border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }

    /* Bird of the Day image fills the hero card */
    .botd-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Gradient overlay so text reads on any photo */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(0,0,0,0.05) 65%,
        rgba(0,0,0,0.75) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    /* "Bird of the Day" tag (top) */
    .botd-tag {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    /* Bird name (bottom) */
    .botd-name {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      text-align: center;
      padding: 0 32px;
      max-width: 100%;
      line-height: 1.15;
    }

    /* ── Bottom bar — both buttons side by side ── */
    .bottom-bar {
      width: 90%;
      max-width: 480px;
      padding: 20px 0 max(22px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 8vw, 64px);
    }

    /* shared button base */
    .btn {
      width:  clamp(60px, 5vh, 76px);
      height: clamp(60px, 5vh, 76px);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      padding: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: scale(0.92); }

    /* Explore — outlined style */
    .btn-explore {
      background: rgba(168, 224, 106, 0.08);
      border: 2.5px solid rgba(255, 255, 255, 0.7) !important;
      box-shadow: 0 0 0 5px rgba(168, 224, 106, 0.08), 0 4px 16px rgba(0,0,0,0.35);
    }
    .btn-explore:hover {
      background: rgba(168, 224, 106, 0.15);
      transform: scale(1.07);
      box-shadow: 0 0 0 8px rgba(168, 224, 106, 0.12), 0 6px 20px rgba(0,0,0,0.4);
    }
    .btn-explore .btn-icon  { font-size: clamp(1.1rem, 2.4vh, 1.5rem); }
    .btn-explore .btn-label { color: #fff; }

    /* Identify — filled style */
    .btn-identify {
      background: radial-gradient(circle at 35% 35%, #c5f07a, #6dbf2f);
      border: 3px solid #a8e06a !important;
      box-shadow: 0 0 0 6px rgba(168, 224, 106, 0.18), 0 6px 22px rgba(0,0,0,0.45);
    }
    .btn-identify:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 10px rgba(168, 224, 106, 0.22), 0 8px 26px rgba(0,0,0,0.5);
    }
    .btn-identify .btn-icon  { font-size: clamp(1.1rem, 2.4vh, 1.5rem); }
    .btn-identify .btn-label { color: #1a3d0a; }

    /* shared label */
    .btn-label {
      font-size: clamp(0.38rem, 0.9vh, 0.52rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1;
    }

    /* caption under each button */
    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .btn-caption {
      font-size: clamp(0.6rem, 1.6vw, 0.72rem);
      color: rgba(255,255,255,0.85);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <!-- Red-crested Cardinal logo -->
      <img class="logo-svg" src="https://res.cloudinary.com/dyw8gorqu/image/upload/app_assets/emojis/red-crested-cardinal-emoji.png" alt="Red-crested Cardinal"/>

      <div class="header-text">
        <h1>Flight Score</h1>
        <p>North American Birds</p>
      </div>
    </div>
  </header>

  <div class="hero">
    <img class="botd-img" id="botdImg" alt=""/>
    <span class="c-tl"></span>
    <span class="c-tr"></span>
    <span class="c-bl"></span>
    <span class="c-br"></span>
    <div class="botd-tag">Bird of the Day</div>
    <div class="botd-name" id="botdName"></div>
  </div>

  <div class="bottom-bar">

    <div class="btn-wrap">
      <button class="btn btn-explore" onclick="explore()">
        <span class="btn-icon">🗺️</span>
        <span class="btn-label">Explore</span>
      </button>
      <span class="btn-caption">Explore</span>
    </div>

    <div class="btn-wrap">
      <button class="btn btn-identify" onclick="identify()">
        <span class="btn-icon">🔍</span>
        <span class="btn-label">Identify</span>
      </button>
      <span class="btn-caption">Identify</span>
    </div>

  </div>

  <script src="birds.js"></script>
  <script>
    // ── Bird of the Day ──────────────────────────────────────────────
    // Same bird for the whole day (rotates each midnight), picked
    // deterministically from BIRD_LIST using day-of-year as a seed.
    const POSSESSIVE_NAMES = new Set([
      "Aberts","Ainleys","Aleutian","Allens","Annas","Audubons","Bachmans","Bairds",
      "Barrows","Belchers","Bells","Bendires","Bewicks","Bicknells","Bishops","Botteris",
      "Brandts","Brants","Brewers","Bryans","Bullers","Bullocks","Bulwers","Cassins",
      "Clarks","Cooks","Coopers","Corys","Costas","Couchs","Craveris","Erckels",
      "Forsters","Franklins","Gambels","Graces","Hammonds","Harriss","Heermanns",
      "Henslows","Huttons","Jouanins","Kirtlands","Kittlitzs","LeContes","Leachs",
      "Lessons","Lewiss","Lincolns","Lucys","MacGillivrays","McCowns","McKays",
      "Morelets","Murphys","Naumanns","Nelsons","Newells","Nuttalls","Nuttings",
      "Pallass","Parkinsons","Ridgways","Rosss","Sabines","Salvins","Says","Scopolis",
      "Scotts","Scrippss","Smiths","Spragues","Stejnegers","Stellers","Swainsons",
      "Temmincks","Townsends","Tristrams","Vauxs","Virginias","Williamsons","Wilsons",
      "Worthens","Xantuss","Zinos","Rivolis"
    ]);

    function displayName(folder) {
      // Special cases
      const specials = {
        "Chuck-wills-widow":               "Chuck-will's-widow",
        "Atlantic_Yellow-nosed_(Yellow-nosed)_Albatross": "Atlantic Yellow-nosed Albatross",
        "Desertas_(Feas)_Petrel":          "Desertas Petrel",
        "Eurasian_(Common)_Hoopoe":        "Eurasian Hoopoe",
        "Eurasian_(Common)_Moorhen":       "Eurasian Moorhen",
        "Gray-headed_(Purple)_Swamphen":   "Gray-headed Swamphen",
        "Mangrove_Yellow_(Yellow)_Warbler":"Mangrove Yellow Warbler",
        "Northern_Yellow_(Yellow)_Warbler":"Northern Yellow Warbler",
        "Pacific_(Fork-tailed)_Swift":     "Pacific Swift",
      };
      if (specials[folder]) return specials[folder];
      return folder.split('_').map(p => {
        if (POSSESSIVE_NAMES.has(p)) return p.slice(0, -1) + "'s";
        return p;
      }).join(' ');
    }

    function pickTodaysBird() {
      // Days since Unix epoch (UTC) — same for everyone, rotates at UTC midnight
      const day = Math.floor(Date.now() / 86400000);
      const idx = day % BIRD_LIST.length;
      return BIRD_LIST[idx];
    }

    (function setBirdOfTheDay() {
      const folder = pickTodaysBird();
      const url = `https://res.cloudinary.com/dyw8gorqu/image/upload/birds/${folder}/${folder}.jpg`;
      const img = document.getElementById('botdImg');
      const name = document.getElementById('botdName');
      const displayed = displayName(folder);
      img.src = url;
      img.alt = displayed;
      name.textContent = displayed;
    })();

    function explore() {
      // Flag that this navigation came from the home page, so explore.html
      // knows it's allowed to render (vs. a direct visit / page refresh).
      sessionStorage.setItem('flightScoreNav', 'explore');
      window.location.href = 'explore.html';
    }
    function identify() { alert('Identify tapped!'); }
  </script>

</body>
</html>
