<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .home-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .home-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Profile</div>
    <button class="home-btn" onclick="goHome()" title="Home">🏠</button>
  </header>

  <main>
    <!-- Profile content goes here -->
  </main>

  <script>
    function goHome() {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
