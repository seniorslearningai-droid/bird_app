<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Score — Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #ff6a00 0%, #ff8c00 50%, #ff5500 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 100, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .home-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .home-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .create-btn {
      width: 100%;
      margin-top: auto;
      margin-bottom: 120px;
      padding: 18px 24px;
      background: radial-gradient(circle at 35% 35%, #c5f07a, #6dbf2f);
      border: 3px solid #a8e06a;
      border-radius: 18px;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a3d0a;
      cursor: pointer;
      box-shadow: 0 0 0 6px rgba(168, 224, 106, 0.18), 0 6px 22px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .create-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 0 10px rgba(168, 224, 106, 0.22), 0 8px 26px rgba(0,0,0,0.4);
    }
    .create-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Profile</div>
    <button class="home-btn" onclick="goHome()" title="Home">🏠</button>
  </header>

  <main>
    <button class="create-btn" onclick="createCharacter()">Create your character</button>
  </main>

  <script>
    function goHome() {
      window.location.href = 'index.html';
    }
    function createCharacter() { alert('Create your character tapped!'); }
  </script>

</body>
</html>
